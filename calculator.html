<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4ff, #dfeeff);
    }

    .calculator {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      padding: 20px;
    }

    .display {
      width: 100%;
      height: 80px;
      background: #2b2b2b;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 2rem;
      text-align: right;
      padding: 20px 15px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .operator {
      background: #f4b942;
      color: #1a1a1a;
      font-weight: bold;
    }

    .number {
      background: #e6e6e6;
      color: #1a1a1a;
    }

    .clear {
      background: #ff6b6b;
      color: white;
    }

    .equal {
      background: #4ecdc4;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" type="text" id="display" disabled />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>
      <button class="operator" onclick="deleteLast()">⌫</button>

      <button class="number" onclick="appendValue('7')">7</button>
      <button class="number" onclick="appendValue('8')">8</button>
      <button class="number" onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button class="number" onclick="appendValue('4')">4</button>
      <button class="number" onclick="appendValue('5')">5</button>
      <button class="number" onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="number" onclick="appendValue('1')">1</button>
      <button class="number" onclick="appendValue('2')">2</button>
      <button class="number" onclick="appendValue('3')">3</button>
      <button class="equal" onclick="calculateResult()">=</button>

      <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button class="number" onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = "";
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
      try {
        const expression = display.value
          .replace(/×/g, "*")
          .replace(/÷/g, "/");

        if (!expression) {
          return;
        }

        const result = Function(`"use strict"; return (${expression})`)();
        display.value = Number.isInteger(result) ? result : result.toFixed(2);
      } catch {
        display.value = "Error";
      }
    }
  </script>
</body>
</html>
