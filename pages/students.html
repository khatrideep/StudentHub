                <p class="eyebrow">Campus community</p>
                <h1>Student Directory</h1>
                <p class="text-muted">Find fellow students by name, course, year, or city.</p>
            </section>

            <section class="directory-tools" aria-label="Directory filters">
                <div class="form-group">
                    <label for="studentSearch">Search students</label>
                    <input id="studentSearch" type="search" placeholder="Search by name, course, year, or city" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="programFilter">Course</label>
                    <select id="programFilter">
                        <option value="">All courses</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="yearFilter">Academic year</label>
                    <select id="yearFilter">
                        <option value="">All years</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studentSort">Sort by</label>
                    <select id="studentSort">
                        <option value="name">Name (A–Z)</option>
                        <option value="course">Course</option>
                        <option value="year">Academic year</option>
                        <option value="city">City</option>
                    </select>
                </div>
            </section>

            <p id="directoryStatus" class="directory-status" role="status" aria-live="polite">Loading students…</p>
            <section id="studentsContainer" class="student-grid" aria-label="Students" aria-busy="true"></section>
