<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Hub - Register</title>
    <link rel="stylesheet" href="../styles/register.css">
</head>

<body>

    <div class="page-wrapper">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="../logo.jpeg" alt="Student Hub Logo" style="width: 50px; height: 50px; border-radius: 10px; margin: 0 auto;" />
        </div>
        <h1>Register</h1>
        <p class="text-muted">Create your Student Hub account.</p>

        <form>
            <div class="two-col">
                <div class="form-group"><label>Full name</label><input type="text" placeholder="Name" /></div>
                <div class="form-group"><label>Mobile</label><input type="tel" placeholder="+91" /></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" placeholder="Email" /></div>
            <div class="form-group"><label>Date of birth</label><input type="date" /></div>
            <div class="form-group"><label>Password</label><input type="password" placeholder="Create password" /></div>
            <div class="form-group"><label>Confirm password</label><input type="password" placeholder="Confirm" /></div>
            <label style="font-weight:400; margin-bottom:12px; display:flex; gap:8px;"><input type="checkbox" /> I agree
                to terms</label>
            <button type="submit" class="btn">Register</button>
        </form>

        <p class="footer-text">Already have an account? <a href="login.html">Login</a></p>

        <footer class="footer">
            <p>&copy; 2026 Student Hub</p>
        </footer>
    </div>

</body>

</html>
