<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Hub - Feedback</title>
    <link rel="stylesheet" href="../styles/feedback.css">
</head>

<body>

    <div class="page-wrapper">
        <div class="main-content">

            <header class="navbar">
                <a href="../index.html" class="brand"><div class="logo"><img src="../logo.jpeg" alt="Student Hub Logo" /></div>Student Hub</a>
                <ul class="nav-links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li><a href="feedback.html">Feedback</a></li>
                    <li><a href="faqs.html">FAQs</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </header>

            <div class="panel">
                <h1>Feedback</h1>
                <p class="text-muted" style="margin-bottom: 16px;">Share your suggestions to improve services,
                    facilities, and campus experience.</p>
                <form>
                    <div class="form-group"><label>Name</label><input type="text" placeholder="Your name" /></div>
                    <div class="form-group"><label>Email</label><input type="email" placeholder="Email" /></div>
                    <div class="form-group"><label>Category</label><select>
                            <option>Campus facility</option>
                            <option>Academic</option>
                            <option>Event</option>
                        </select></div>
                    <div class="form-group"><label>Rating</label>
                        <div class="rating-group"><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
                        </div>
                    </div>
                    <div class="form-group"><label>Message</label><textarea placeholder="Write feedback"></textarea>
                    </div>
                    <button type="submit" class="btn">Send Feedback</button>
                </form>
            </div>

        </div>

        <footer class="footer">
            <p>&copy; 2026 Student Hub &middot; <a href="contact.html">Contact Us</a></p>
        </footer>
    </div>

</body>

</html>
